# Portainer-friendly stack: pulls the prebuilt image from GHCR instead of
# building on the target host. Use this when deploying to a test server
# (Stacks -> Add stack -> Repository, pointing at this file, or paste it
# into the Web editor).
#
# ghcr.io/ulfendk/domarchy is public, so no registry credentials are
# needed in Portainer - just pull and deploy.
services:
  domarchy:
    image: ghcr.io/ulfendk/domarchy:latest
    container_name: domarchy
    ports:
      - "3389:3389"
    environment:
      - DISPLAY=:0
      - MEMORY=8G
      - CPUS=4
      - PULSE_SERVER=unix:/tmp/pulse.socket
    volumes:
      - ./data:/data
      - ./shared:/shared
      # Optional: only works if the host has a PulseAudio user session at
      # this path. Remove this line (and the audiodev flags won't matter -
      # QEMU just won't have sound) if the test server has none.
      - /run/user/1000/pulse/native:/tmp/pulse.socket
