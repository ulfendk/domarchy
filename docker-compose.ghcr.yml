# Portainer-friendly stack: pulls the prebuilt image from GHCR instead of
# building on the target host. Use this when deploying to a test server
# (Stacks -> Add stack -> Repository, pointing at this file, or paste it
# into the Web editor).
#
# ghcr.io/ulfendk/domarchy is public, so no registry credentials are
# needed in Portainer - just pull and deploy.
services:
  domarchy:
    image: ghcr.io/ulfendk/domarchy:latest
    # :latest is a moving tag - without this, a redeploy can silently reuse
    # whatever was pulled last time instead of picking up a new push.
    pull_policy: always
    container_name: domarchy
    ports:
      - "3389:3389"
    environment:
      - DISPLAY=:0
      - MEMORY=8G
      - CPUS=4
    volumes:
      - ./data:/data
      - ./shared:/shared
      # Audio is off by default here since a headless test server usually
      # has no PulseAudio user session. To enable it, add:
      #   - PULSE_SERVER=unix:/tmp/pulse.socket   (under environment)
      #   - /run/user/1000/pulse/native:/tmp/pulse.socket
