[Globals]
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true

; Use classic RDP security (not NLA/CredSSP or TLS) so xrdp draws its own
; login form instead of requiring a real Windows-style credential handshake
; before the session even starts. This lets any username/password through
; to the vnc-bridge module below, which ignores them anyway (see NOTE).
security_layer=rdp
crypt_level=high
certificate=
key_file=

allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

; Skip the session-type picker and go straight to the VNC bridge below.
autorun=vnc-bridge
require_credentials=true

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=true
SyslogLevel=INFO

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=false
xrdpvr=false
tcutils=false

; NOTE: this doesn't start a new X session - it redirects the RDP client
; straight through to the VNC server QEMU already exposes on 127.0.0.1:5900.
; Because ip/port are fixed (not "ask"), xrdp-sesman connects libvnc.so
; directly to that address instead of spawning anything, so no Linux PAM
; account is involved. Whatever username/password you type at the RDP
; login prompt is unused, since the backing QEMU VNC server has no password.
[vnc-bridge]
name=vnc-bridge
lib=libvnc.so
ip=127.0.0.1
port=5900
username=na
password=na
; entrypoint.sh already waits for QEMU's VNC server to accept connections
; before starting xrdp, so this is just a small extra safety margin, not
; the primary fix for the startup race.
delay_ms=500
